<style>
:root{--paper:#f6ecdc;--paper2:#efe1ca;--ink:#4a3428;--soft:#8a6a55;--accent:#c8643c;--tape:rgba(240,214,160,.75)}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Gowun Batang","Apple SD Gothic Neo",serif}
body{background-image:radial-gradient(rgba(120,80,40,.06) 1px,transparent 1.2px),radial-gradient(ellipse at 50% 0%,#fbf3e6,var(--paper) 60%);background-size:6px 6px,100% 100%;min-height:100vh}
.hand{font-family:"Nanum Pen Script","Apple SD Gothic Neo",cursive}
header{display:flex;justify-content:space-between;align-items:center;padding:26px 4vw}
.brand{font:700 22px "Helvetica Neue",Arial,sans-serif;letter-spacing:-.06em;color:var(--ink);text-decoration:none}.brand i{font-style:normal;color:var(--accent)}
.back{font-size:22px;color:var(--soft);text-decoration:none}.back:hover{color:var(--accent)}
/* gate */
.gate{min-height:calc(100vh - 90px);display:flex;align-items:center;justify-content:center;padding:20px}
.lockcard{background:#fffaf1;padding:22px 22px 30px;width:min(360px,92vw);box-shadow:0 14px 34px rgba(90,60,30,.18),0 2px 4px rgba(90,60,30,.08);transform:rotate(-1.6deg);position:relative;text-align:center}
.lockcard:before{content:"";position:absolute;top:-14px;left:50%;width:110px;height:28px;margin-left:-55px;background:var(--tape);transform:rotate(3deg)}
.lockcard .ph{aspect-ratio:1;background:linear-gradient(160deg,#f3dcc0,#d9a47f);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.lockcard .ph svg{width:64px;height:64px;opacity:.9}
.lockcard h1{font-size:40px;margin:0;font-weight:400}.lockcard p{margin:6px 0 18px;color:var(--soft);font-size:14px}
.lockcard input{width:100%;border:0;border-bottom:1.5px solid #d8c2a6;background:transparent;font:inherit;font-size:16px;padding:8px 2px;text-align:center;color:var(--ink);outline:none}
.lockcard input:focus{border-color:var(--accent)}
.lockcard button{margin-top:16px;border:0;background:var(--accent);color:#fff8ef;font:inherit;font-size:15px;padding:10px 26px;border-radius:30px;cursor:pointer;box-shadow:0 4px 10px rgba(200,100,60,.3)}
.err{color:#b4472a;font-size:13px;height:16px;margin-top:10px}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-6px) rotate(-1.6deg)}40%,80%{transform:translateX(6px) rotate(-1.6deg)}}
/* album */
.album{padding:10px 4vw 80px;display:none}.album.on{display:block;animation:in .8s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{text-align:center;margin:10px 0 40px}.hero h1{font-size:clamp(52px,7vw,92px);margin:0;font-weight:400;line-height:1}
.hero p{color:var(--soft);margin:8px 0 0;font-size:15px}
.sample{display:inline-block;margin-top:14px;padding:5px 12px;border:1px dashed #c9a27e;color:#a46a43;font-size:13px;border-radius:20px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:46px 34px;max-width:1240px;margin:0 auto}
.pol{background:#fffaf1;padding:12px 12px 16px;box-shadow:0 10px 24px rgba(90,60,30,.16),0 1px 3px rgba(90,60,30,.1);transition:transform .35s cubic-bezier(.2,.8,.3,1.2),box-shadow .35s;cursor:zoom-in;position:relative;opacity:0;animation:drop .7s forwards}
.pol:before{content:"";position:absolute;top:-11px;left:50%;width:80px;height:22px;margin-left:-40px;background:var(--tape);transform:rotate(var(--tr,2deg))}
.pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block;filter:sepia(.12) saturate(1.05)}
.pol .d{font-size:13px;color:var(--soft);margin-top:12px;letter-spacing:.04em}
.pol .t{font-size:27px;line-height:1.05;margin-top:2px}.pol .n{font-size:21px;color:var(--soft);line-height:1.1;margin-top:4px}
.pol:hover{transform:rotate(0) scale(1.04)!important;box-shadow:0 18px 40px rgba(90,60,30,.25);z-index:2}
@keyframes drop{from{opacity:0;transform:translateY(-14px) rotate(var(--r))}to{opacity:1;transform:rotate(var(--r))}}
.view{position:fixed;inset:0;background:rgba(74,52,40,.55);display:none;align-items:center;justify-content:center;padding:4vw;z-index:9;cursor:zoom-out;backdrop-filter:blur(3px)}
.view.on{display:flex;animation:in .3s}
.view .pol{max-width:min(560px,90vw);opacity:1;animation:none;transform:rotate(-1deg);cursor:zoom-out}
.view .pol .t{font-size:38px}.view .pol .n{font-size:27px}
footer{text-align:center;color:var(--soft);font-size:13px;padding:30px 0 50px}
</style></head><body>

async function open_(pw){const enc=new TextEncoder();const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BLOB.s),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BLOB.i)},key,b64(BLOB.c));return JSON.parse(new TextDecoder().decode(pt))}

 const w=document.getElementById('wall');d.items.forEach((it,i)=>{const r=(i%2?1:-1)*(1+((i*37)%5)*.6);const el=document.createElement('figure');el.className='pol';el.style.setProperty('--r',r+'deg');el.style.setProperty('--tr',(i%3-1)*4+'deg');el.style.animationDelay=(i*.09)+'s';el.style.margin='0';

  el.onclick=()=>{const v=document.getElementById('view');v.innerHTML='';const c=el.cloneNode(true);c.style.animation='none';c.style.opacity=1;v.appendChild(c);v.classList.add('on')};w.appendChild(el)})}
document.getElementById('view').onclick=e=>e.currentTarget.classList.remove('on');
addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('view').classList.remove('on')});
const lock=document.getElementById('lock');
lock.onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw').value;const err=document.getElementById('err');err.textContent='여는 중…';
 try{const d=await open_(pw);sessionStorage.setItem('gn-story',pw);render(d)}catch(_){err.textContent='음, 그게 아닌 것 같아요';lock.classList.remove('shake');void lock.offsetWidth;lock.classList.add('shake')}};
(async()=>{const s=sessionStorage.getItem('gn-story');if(s){try{render(await open_(s))}catch(_){}}else document.getElementById('pw').focus()})();
